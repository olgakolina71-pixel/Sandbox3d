<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>MINI SANDBOX 3D</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game">
    <canvas id="renderCanvas" aria-label="3D game world"></canvas>
    <header class="topbar">
      <a class="brand" href="./">MINI <span>SANDBOX</span></a>
      <div class="top-actions">
        <button id="roomToggle" class="ui-button room-toggle" type="button">🌐 Мультиплеер</button>
        <button id="verityToggle" class="ui-button verity-toggle" type="button">☺ Верити</button>
        <button id="saveBtn" class="ui-button">Сохранить</button>
        <button id="resetBtn" class="ui-button danger">Сбросить</button>
      </div>
    </header>
    <aside class="panel">
      <div class="panel-title">СТРОИТЕЛЬСТВО</div>
      <div class="tool-row">
        <button id="buildBtn" class="tool active" title="Строить">＋ <small>Строить</small></button>
        <button id="removeBtn" class="tool" title="Удалять">－ <small>Удалять</small></button>
      </div>
      <div class="panel-title materials-title">МАТЕРИАЛЫ</div>
      <div id="materials" class="materials">
        <button class="material selected" data-material="grass"><i class="swatch grass"></i>Трава</button>
        <button class="material" data-material="stone"><i class="swatch stone"></i>Камень</button>
        <button class="material" data-material="wood"><i class="swatch wood"></i>Дерево</button>
        <button class="material" data-material="sand"><i class="swatch sand"></i>Песок</button>
        <button class="material" data-material="brick"><i class="swatch brick"></i>Кирпич</button>
        <button class="material" data-material="neon"><i class="swatch neon"></i>Неон</button>
      </div>
      <div class="hint">ЛКМ — действие · WASD — движение · Space — прыжок</div>
    </aside>
    <section id="roomPanel" class="room-panel" aria-label="Мультиплеер">
      <div class="room-header"><strong>Сетевая игра</strong><button id="roomClose" type="button" aria-label="Закрыть">×</button></div>
      <label>Имя игрока<input id="playerName" maxlength="18" value="Игрок" /></label>
      <label>Комната<input id="roomName" maxlength="24" value="main" /></label>
      <button id="roomJoin" class="room-join" type="button">Подключиться</button>
      <div id="roomStatus" class="room-status">Не подключено</div>
      <div id="playerList" class="player-list">Игроков: 0</div>
      <div id="roomChat" class="room-chat" aria-live="polite"></div>
      <form id="roomChatForm" class="room-chat-form"><input id="roomChatInput" maxlength="160" placeholder="Сообщение в чат..." aria-label="Сообщение в комнату" /><button type="submit">➤</button></form>
    </section>
    <section id="verityPanel" class="verity-panel" aria-label="Чат с Верити">
      <div class="verity-header">
        <div class="verity-avatar">☺</div>
        <div><strong>Верити</strong><small>3D-компаньон</small></div>
        <button id="verityClose" type="button" aria-label="Закрыть чат">×</button>
      </div>
      <div id="verityMessages" class="verity-messages" aria-live="polite"></div>
      <form id="verityForm" class="verity-form">
        <input id="verityInput" type="text" maxlength="180" autocomplete="off" placeholder="Напиши Верити..." aria-label="Сообщение Верити" />
        <button type="submit" aria-label="Отправить">➤</button>
      </form>
      <div class="verity-note">Локальный игровой помощник</div>
    </section>
    <div id="verityBubble" class="verity-bubble"></div>
    <div class="crosshair">＋</div>
    <div id="status" class="status">Загрузка мира…</div>
    <div class="mobile-controls">
      <div class="move-pad">
        <button data-move="forward">▲</button>
        <div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
      </div>
      <div class="look-pad"><button id="jumpBtn">ПРЫЖОК</button><button id="mobileAction">СТРОИТЬ</button></div>
    </div>
    <div class="footer-note">MINI SANDBOX 3D <span>•</span> Creative mode</div>
  </div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
